<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-row">
        <div></div>
        <div>
          <h1>Mergington High School</h1>
          <h2>Extracurricular Activities</h2>
        </div>
        <div class="auth-panel">
          <span id="user-status">Not signed in</span>
          <button id="login-toggle" type="button">Login</button>
          <button id="logout-btn" type="button" class="hidden">Logout</button>
        </div>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="auth-form" class="auth-form hidden">
          <div class="form-group">
            <label for="auth-email">Email:</label>
            <input type="email" id="auth-email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="auth-password">Password:</label>
            <input type="password" id="auth-password" required placeholder="Password" />
          </div>
          <div class="form-group hidden" id="name-group">
            <label for="auth-name">Full Name:</label>
            <input type="text" id="auth-name" placeholder="Student name" />
          </div>
          <div class="auth-actions">
            <button type="submit" id="auth-submit">Login</button>
            <button type="button" id="auth-switch" class="secondary-btn">Register instead</button>
          </div>
        </form>

        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
